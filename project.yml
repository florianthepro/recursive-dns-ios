name: RecursiveDNS
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Project.xcconfig
  Release: Config/Project.xcconfig
settings:
  base:
    SWIFT_VERSION: $(SWIFT_VERSION)
    IPHONEOS_DEPLOYMENT_TARGET: $(IPHONEOS_DEPLOYMENT_TARGET)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  RecursiveDNS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared/Preferences.swift
    resources:
      - path: App/Assets.xcassets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Recursive DNS
        CFBundleName: RecursiveDNS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: App/RecursiveDNS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: RecursiveDNSProxy
        embed: true
  RecursiveDNSProxy:
    type: app-extension
    platform: iOS
    sources:
      - path: Proxy
      - path: Resolver
      - path: Shared
    info:
      path: Proxy/Info.plist
      properties:
        CFBundleDisplayName: Recursive DNS Proxy
        CFBundleName: RecursiveDNSProxy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.dns-proxy
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DNSProxyProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PROXY_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: Proxy/RecursiveDNSProxy.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  RecursiveDNSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Resolver
      - path: Shared
    info:
      path: Tests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: RecursiveDNS
schemes:
  RecursiveDNS:
    build:
      targets:
        RecursiveDNS: all
        RecursiveDNSProxy: all
        RecursiveDNSTests: [test]
    test:
      targets:
        - RecursiveDNSTests
    archive:
      config: Release
