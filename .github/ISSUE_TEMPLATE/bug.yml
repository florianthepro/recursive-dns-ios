name: Fehlerbericht
description: Einen reproduzierbaren Fehler melden
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Bitte keine privaten DNS-Verläufe, IP-Adressen, Zugangsdaten oder vertraulichen Domains veröffentlichen.
  - type: input
    id: version
    attributes:
      label: App-Version und Build
      placeholder: 1.0.0 (1)
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS-Version und Gerät
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduktionsschritte
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
    validations:
      required: true
